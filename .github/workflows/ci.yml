# 只做构建校验，不发布。发布走本地 `pnpm deploy`（见 README / PRD/2026-08-09-publishing-guide.md）。
# 所以这里没有任何 Cloudflare 凭据，仓库也不需要 CLOUDFLARE_API_TOKEN 这个 secret。
#
# 仍然保留两件事：
# 1. push / PR 都跑一遍完整 `pnpm build`（含 fonts:check、verify-build）。Sveltia CMS 在
#    /admin 里直接提交到 main，这是唯一能提前发现"提交后站点构建不过"的地方。
# 2. push 到 main 时补齐中文标题字体子集并回写（原先在部署流程里，行为不变）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 连续两次 push 时取消上一次跑到一半的校验
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 仅 push 到 main 时回写字体子集需要；pull_request 的 token 本来就是只读

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # volta.node
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 在 CMS 里发一篇带新汉字标题的文章时，作者没有机会跑 pnpm fonts，
      # 而 pnpm build 第一步就是 fonts:check —— 缺字直接失败。
      # 这一步补齐子集：它要联网拉 Google Fonts 的 text= 精确子集，而
      # GitHub Actions 有网络。只在 push 到 main 时跑：PR 里缺字就该让构建红掉，
      # 否则会拿一个 CI 里临时生成、没提交进仓库的子集去"通过"校验。
      - name: 重新生成中文标题字体子集
        if: github.event_name == 'push'
        run: pnpm fonts

      # 只有真的变了才提交。用 GITHUB_TOKEN 推的 commit 不会再触发 workflow
      # （GitHub 的递归保护），所以这里不会死循环。
      - name: 子集有变动则回写仓库
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- public/fonts; then
            echo "字体子集无变化，跳过"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fonts
          git commit -m 'chore: 同步中文标题字体子集'
          # 万一撞上并发提交推不上去，不该因此让校验变红——下次 push 会再补一遍。
          git push || echo '::warning::字体子集回写失败（可能有并发提交）'

      - run: pnpm build
